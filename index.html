<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141b1b" />
    <meta
      name="description"
      content="133 car models. Nine circuits. Build your own tracks, beat your best times and master the trigger in Slot Club, the free browser slot-car club."
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://scalextric-chi.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Slot Club" />
    <meta property="og:title" content="Slot Club — Small cars. Big racing." />
    <meta
      property="og:description"
      content="133 models. Nine circuits. Build a track, find the limit and beat your best. 100 million starting credits. Desktop + mobile."
    />
    <meta property="og:url" content="https://scalextric-chi.vercel.app/" />
    <meta
      property="og:image"
      content="https://scalextric-chi.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Slot Club — Small cars. Big racing. A retro racing poster featuring a Lancia Stratos."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slot Club — Small cars. Big racing." />
    <meta
      name="twitter:description"
      content="133 models. Nine circuits. Your next obsession. 100 million starting credits."
    />
    <meta
      name="twitter:image"
      content="https://scalextric-chi.vercel.app/og-image.png"
    />
    <script>
      try {
        const t =
          JSON.parse(localStorage.getItem("slot-club:v1") || "{}").settings
            ?.theme || "dark";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Slot Club — Small cars. Big racing.</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
